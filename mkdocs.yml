      - Choosing a Specialization: guides/choosing-a-specialization.md
      - How to Read a Job Posting: guides/reading-job-postings.md
      - Building a Portfolio: guides/building-a-portfolio.md
      - Ethics & Legality: guides/ethics-and-legality.md
  - Areas:
      - Foundations: areas/foundations.md
      - Network Security: areas/network-security.md
      - Security Operations: areas/security-operations.md
      - Offensive Security: areas/offensive-security.md
      - Malware Analysis & Reverse Engineering: areas/malware-analysis-reverse-engineering.md
      - Digital Forensics: areas/digital-forensics.md
      - Hardware Security: areas/hardware-security.md
      - IoT & Wireless Security: areas/iot-wireless-security.md
      - AI & Cybersecurity: areas/ai-security.md
      - Cloud Security: areas/cloud-security.md
      - Application & Web Security: areas/application-web-security.md
      - Cryptography: areas/cryptography.md
      - Identity & Access Management: areas/identity-access-management.md
      - Governance, Risk & Compliance: areas/governance-risk-compliance.md
      - OT/ICS & Critical Infrastructure: areas/ot-ics-security.md
      - Threat Intelligence: areas/threat-intelligence.md
      - Social Engineering & Human Factors: areas/social-engineering-human-factors.md
      - Mobile Security: areas/mobile-security.md
