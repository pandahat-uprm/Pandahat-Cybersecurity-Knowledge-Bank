site_name: PandaHat Cybersecurity Knowledge Bank
site_description: Free, beginner-friendly cybersecurity guides for every UPRM student.
site_author: PandaHat, University of Puerto Rico at Mayagüez
site_url: https://pandahat-uprm.github.io/cyber-knowledge-bank/
repo_url: https://github.com/pandahat-uprm/cyber-knowledge-bank
repo_name: pandahat-uprm/cyber-knowledge-bank
edit_uri: edit/main/docs/
copyright: Content CC BY-SA 4.0 · Code MIT · PandaHat, UPR Mayagüez

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follow the reader's system setting by default
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black        # adjust to PandaHat's colors
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - en
        - es          # lets bilingual readers search with Spanish word forms

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

watch:
  - includes

validation:
  anchors: warn     # broken in-page links fail the --strict build

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pandahat-uprm

